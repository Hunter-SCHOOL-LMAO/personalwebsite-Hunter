<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Colors Database - Hunter's Portfolio</title>
    
    <style media="screen">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #212315;
        background-color: #636B2F;
      }

      /* Header Navigation */
      header {
        background-color: #212315;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }

      nav {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 20px;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 0;
      }

      nav ul li a {
        display: block;
        color: #eceee2;
        text-decoration: none;
        padding: 20px 30px;
        font-size: 16px;
        font-weight: 500;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      nav ul li a:hover {
        background-color: #333;
        color: #eceee2;
      }

      nav ul li a.active {
        background-color: #444;
      }

      /* Main Content */
      main {
        margin-top: 80px;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 20px;
        color: #212315;
        text-align: center;
      }

      .intro {
        font-size: 18px;
        text-align: center;
        margin-bottom: 40px;
        color: #212315;
      }

      /* Loading state */
      .loading {
        text-align: center;
        font-size: 20px;
        color: #212315;
        padding: 40px;
      }

      /* Colors Grid */
      .colors-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 25px;
        padding: 20px 0;
      }

      .color-card {
        background: white;
        border: 3px solid #212315;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .color-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 12px rgba(0,0,0,0.2);
      }

      .color-preview {
        width: 100%;
        height: 150px;
        border: 2px solid #212315;
        border-radius: 4px;
        margin-bottom: 15px;
      }

      .color-info {
        color: #212315;
      }

      .color-info h3 {
        font-size: 22px;
        margin-bottom: 10px;
        color: #212315;
      }

      .color-info p {
        font-size: 14px;
        margin: 5px 0;
        color: #333;
      }

      .color-value {
        font-family: 'Courier New', monospace;
        background-color: #f5f5f5;
        padding: 5px 8px;
        border-radius: 3px;
        display: inline-block;
        margin-top: 5px;
      }

      /* Error message */
      .error {
        background-color: #ff4444;
        color: white;
        padding: 20px;
        border-radius: 8px;
        text-align: center;
        margin: 20px 0;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #212315;
      }

      .empty-state h2 {
        font-size: 32px;
        margin-bottom: 15px;
      }

      .empty-state p {
        font-size: 18px;
      }

      /* Add Color Button */
      .add-color-btn {
        background-color: #212315;
        color: #eceee2;
        border: none;
        padding: 15px 30px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 8px;
        cursor: pointer;
        display: block;
        margin: 0 auto 30px;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .add-color-btn:hover {
        background-color: #333;
        transform: scale(1.05);
      }

      /* Modal Styles */
      .modal {
        display: none;
        position: fixed;
        z-index: 2000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.6);
        overflow: auto;
      }

      .modal.show {
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background-color: white;
        padding: 30px;
        border: 3px solid #212315;
        border-radius: 12px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
      }

      .modal-header h2 {
        font-size: 28px;
        color: #212315;
        margin: 0;
      }

      .close-btn {
        background: none;
        border: none;
        font-size: 32px;
        color: #212315;
        cursor: pointer;
        line-height: 1;
        padding: 0;
        width: 30px;
        height: 30px;
      }

      .close-btn:hover {
        color: #666;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #212315;
        font-size: 16px;
      }

      .form-group input,
      .form-group textarea {
        width: 100%;
        padding: 12px;
        border: 2px solid #212315;
        border-radius: 6px;
        font-size: 16px;
        font-family: inherit;
      }

      .form-group input:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: #636B2F;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 80px;
      }

      .color-input-group {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .color-input-group input[type="color"] {
        width: 80px;
        height: 50px;
        padding: 5px;
        cursor: pointer;
      }

      .color-input-group input[type="text"] {
        flex: 1;
      }

      .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
      }

      .btn {
        flex: 1;
        padding: 12px 24px;
        font-size: 16px;
        font-weight: 600;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease, transform 0.2s ease;
      }

      .btn-primary {
        background-color: #212315;
        color: #eceee2;
      }

      .btn-primary:hover {
        background-color: #333;
        transform: translateY(-2px);
      }

      .btn-primary:disabled {
        background-color: #999;
        cursor: not-allowed;
        transform: none;
      }

      .btn-secondary {
        background-color: #ddd;
        color: #212315;
      }

      .btn-secondary:hover {
        background-color: #ccc;
        transform: translateY(-2px);
      }

      .success-message {
        background-color: #4CAF50;
        color: white;
        padding: 15px;
        border-radius: 6px;
        text-align: center;
        margin-bottom: 20px;
        display: none;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        nav ul {
          flex-wrap: wrap;
        }

        nav ul li a {
          padding: 15px 20px;
          font-size: 14px;
        }

        h1 {
          font-size: 36px;
        }

        .colors-grid {
          grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
          gap: 20px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation Header -->
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#projects">Projects</a></li>
          <li><a href="index.html#art">Art</a></li>
          <li><a href="index.html#widgets">Widgets</a></li>
          <li><a href="colors.html" class="active">Colors</a></li>
        </ul>
      </nav>
    </header>

    <!-- Main Content -->
    <main>
      <div class="container">
        <h1>Colors Database</h1>
        <p class="intro">Colors from the collection</p>
        
        <button class="add-color-btn" id="addColorBtn">+ Add New Color</button>
        
        <div id="loading" class="loading">Loading colors...</div>
        <div id="error" class="error" style="display: none;"></div>
        <div id="colorsGrid" class="colors-grid"></div>
        <div id="emptyState" class="empty-state" style="display: none;">
          <h2>No Colors Found</h2>
          <p>The colors collection is empty. Add some colors to your Firestore database to see them here!</p>
        </div>
      </div>
    </main>

    <!-- Add Color Modal -->
    <div id="addColorModal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2>Add New Color</h2>
          <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>
        
        <div id="successMessage" class="success-message">
          Color added successfully!
        </div>

        <form id="addColorForm">
          <div class="form-group">
            <label for="colorName">Color Name *</label>
            <input type="text" id="colorName" name="colorName" required placeholder="e.g., Ocean Blue">
          </div>

          <div class="form-group">
            <label for="colorValue">Color Value *</label>
            <div class="color-input-group">
              <input type="color" id="colorPicker" value="#3498db">
              <input type="text" id="colorValue" name="colorValue" required placeholder="#3498db" pattern="^#([A-Fa-f0-9]{6}|[A-Fa-f0-9]{3})$">
            </div>
          </div>

          <div class="form-group">
            <label for="colorCategory">Category</label>
            <input type="text" id="colorCategory" name="colorCategory" placeholder="e.g., Blues, Warm Tones">
          </div>

          <div class="form-group">
            <label for="colorDescription">Description</label>
            <textarea id="colorDescription" name="colorDescription" placeholder="Describe this color..."></textarea>
          </div>

          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
            <button type="submit" class="btn btn-primary" id="submitBtn">Add Color</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
      // Import Firebase modules
      import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
      import { getFirestore, collection, getDocs, onSnapshot, addDoc } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
      
      // Import Firebase configuration from external config file (gitignored)
      import { firebaseConfig } from './config.js';

      // Initialize Firebase
      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      // Get references to DOM elements
      const loadingEl = document.getElementById('loading');
      const errorEl = document.getElementById('error');
      const colorsGridEl = document.getElementById('colorsGrid');
      const emptyStateEl = document.getElementById('emptyState');

      // Function to display a color card
      function createColorCard(colorData, docId) {
        const card = document.createElement('div');
        card.className = 'color-card';
        
        // Get color value - support different field names
        const colorValue = colorData.color || colorData.hex || colorData.value || colorData.code || '#000000';
        const colorName = colorData.name || docId || 'Unnamed Color';
        
        card.innerHTML = `
          <div class="color-preview" style="background-color: ${colorValue};"></div>
          <div class="color-info">
            <h3>${colorName}</h3>
            <p><strong>Color Code:</strong></p>
            <div class="color-value">${colorValue}</div>
            ${colorData.description ? `<p style="margin-top: 10px;"><strong>Description:</strong> ${colorData.description}</p>` : ''}
            ${colorData.category ? `<p><strong>Category:</strong> ${colorData.category}</p>` : ''}
          </div>
        `;
        
        return card;
      }

      // Function to display colors
      function displayColors(querySnapshot) {
        loadingEl.style.display = 'none';
        colorsGridEl.innerHTML = '';
        
        if (querySnapshot.empty) {
          emptyStateEl.style.display = 'block';
          return;
        }
        
        emptyStateEl.style.display = 'none';
        
        querySnapshot.forEach((doc) => {
          const colorCard = createColorCard(doc.data(), doc.id);
          colorsGridEl.appendChild(colorCard);
        });
      }

      // Function to handle errors
      function handleError(error) {
        console.error("Error loading colors:", error);
        loadingEl.style.display = 'none';
        errorEl.style.display = 'block';
        errorEl.textContent = `Error loading colors: ${error.message}. Please check your Firebase configuration and Firestore rules.`;
      }

      // Modal and form handling
      const modal = document.getElementById('addColorModal');
      const addColorBtn = document.getElementById('addColorBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const addColorForm = document.getElementById('addColorForm');
      const colorPicker = document.getElementById('colorPicker');
      const colorValueInput = document.getElementById('colorValue');
      const submitBtn = document.getElementById('submitBtn');
      const successMessage = document.getElementById('successMessage');

      // Open modal
      addColorBtn.addEventListener('click', () => {
        modal.classList.add('show');
        colorValueInput.value = colorPicker.value;
      });

      // Close modal function
      function closeModal() {
        modal.classList.remove('show');
        addColorForm.reset();
        successMessage.style.display = 'none';
        colorPicker.value = '#3498db';
        colorValueInput.value = '#3498db';
      }

      // Close modal on close button
      closeModalBtn.addEventListener('click', closeModal);

      // Close modal on cancel button
      cancelBtn.addEventListener('click', closeModal);

      // Close modal when clicking outside
      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          closeModal();
        }
      });

      // Sync color picker with text input
      colorPicker.addEventListener('input', (e) => {
        colorValueInput.value = e.target.value.toUpperCase();
      });

      // Sync text input with color picker
      colorValueInput.addEventListener('input', (e) => {
        const value = e.target.value;
        // Validate hex color format
        if (/^#[0-9A-Fa-f]{6}$/.test(value)) {
          colorPicker.value = value;
        }
      });

      // Handle form submission
      addColorForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Disable submit button
        submitBtn.disabled = true;
        submitBtn.textContent = 'Adding...';

        try {
          const colorData = {
            name: document.getElementById('colorName').value.trim(),
            color: document.getElementById('colorValue').value.trim().toUpperCase(),
            category: document.getElementById('colorCategory').value.trim() || null,
            description: document.getElementById('colorDescription').value.trim() || null,
            createdAt: new Date().toISOString()
          };

          // Remove null fields
          Object.keys(colorData).forEach(key => {
            if (colorData[key] === null) {
              delete colorData[key];
            }
          });

          // Add to Firestore
          const colorsRef = collection(db, 'colors');
          await addDoc(colorsRef, colorData);

          // Show success message
          successMessage.style.display = 'block';
          addColorForm.reset();
          
          // Close modal after delay
          setTimeout(() => {
            closeModal();
          }, 1500);

        } catch (error) {
          console.error("Error adding color:", error);
          alert(`Error adding color: ${error.message}`);
        } finally {
          // Re-enable submit button
          submitBtn.disabled = false;
          submitBtn.textContent = 'Add Color';
        }
      });

      // Load colors from Firestore with real-time updates
      try {
        const colorsRef = collection(db, 'colors');
        
        // Set up real-time listener
        onSnapshot(colorsRef, 
          (querySnapshot) => {
            displayColors(querySnapshot);
          },
          (error) => {
            handleError(error);
          }
        );
      } catch (error) {
        handleError(error);
      }
    </script>
  </body>
</html>
