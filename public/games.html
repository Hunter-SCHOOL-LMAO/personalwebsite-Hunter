<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Games - Hunter's Portfolio</title>
    
    <style media="screen">
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        line-height: 1.6;
        color: #212315;
        background-color: #BAC095;
      }

      /* Header Navigation */
      header {
        background-color: #212315;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      }

      nav {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 0 20px;
      }

      nav ul {
        display: flex;
        list-style: none;
        gap: 0;
      }

      nav ul li a {
        display: block;
        color: #eceee2;
        text-decoration: none;
        padding: 20px 30px;
        font-size: 16px;
        font-weight: 500;
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      nav ul li a:hover {
        background-color: #333;
        color: #eceee2;
      }

      nav ul li a.active {
        background-color: #444;
      }

      /* Main Content */
      main {
        margin-top: 80px;
        padding: 40px 20px;
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
      }

      h1 {
        font-size: 48px;
        margin-bottom: 20px;
        color: #212315;
        text-align: center;
      }

      .intro {
        font-size: 18px;
        text-align: center;
        margin-bottom: 40px;
        color: #212315;
      }

      /* Rock Paper Scissors Game */
      .game-container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        border: 3px solid #212315;
        border-radius: 12px;
        padding: 40px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .game-status {
        text-align: center;
        margin-bottom: 30px;
      }

      .game-status h2 {
        font-size: 32px;
        color: #212315;
        margin-bottom: 10px;
      }

      .streak-counter {
        font-size: 24px;
        color: #636B2F;
        font-weight: 600;
        margin-top: 10px;
      }

      .choices {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin: 40px 0;
      }

      .choice-btn {
        width: 120px;
        height: 120px;
        font-size: 60px;
        background-color: white;
        border: 3px solid #212315;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .choice-btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 12px rgba(0,0,0,0.2);
        background-color: #f5f5f5;
      }

      .choice-btn:active {
        transform: translateY(-2px);
      }

      .results {
        text-align: center;
        min-height: 100px;
        margin: 30px 0;
      }

      .results p {
        font-size: 18px;
        color: #333;
        margin: 10px 0;
      }

      .result-message {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 15px;
      }

      .result-message.win {
        color: #4CAF50;
      }

      .result-message.lose {
        color: #f44336;
      }

      .result-message.tie {
        color: #FF9800;
      }

      .player-name-section {
        text-align: center;
        margin-bottom: 30px;
      }

      .player-name-section input {
        padding: 12px 20px;
        font-size: 16px;
        border: 2px solid #212315;
        border-radius: 6px;
        margin-right: 10px;
        width: 250px;
      }

      .player-name-section button {
        padding: 12px 24px;
        font-size: 16px;
        background-color: #212315;
        color: #eceee2;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        transition: background-color 0.3s ease;
      }

      .player-name-section button:hover {
        background-color: #333;
      }

      .leaderboard {
        max-width: 600px;
        margin: 50px auto 0;
        background: white;
        border: 3px solid #212315;
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      }

      .leaderboard h2 {
        font-size: 28px;
        color: #212315;
        text-align: center;
        margin-bottom: 25px;
      }

      .leaderboard-list {
        list-style: none;
      }

      .leaderboard-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px;
        border-bottom: 2px solid #eee;
        font-size: 18px;
      }

      .leaderboard-item:last-child {
        border-bottom: none;
      }

      .leaderboard-rank {
        font-weight: 600;
        color: #636B2F;
        width: 40px;
      }

      .leaderboard-name {
        flex: 1;
        color: #212315;
      }

      .leaderboard-score {
        font-weight: 600;
        color: #212315;
      }

      .loading-message {
        text-align: center;
        color: #666;
        font-style: italic;
      }

      /* Empty state */
      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #212315;
      }

      .empty-state h2 {
        font-size: 32px;
        margin-bottom: 15px;
      }

      .empty-state p {
        font-size: 18px;
      }

      /* Responsive Design */
      @media (max-width: 768px) {
        nav ul {
          flex-wrap: wrap;
        }

        nav ul li a {
          padding: 15px 20px;
          font-size: 14px;
        }

        h1 {
          font-size: 36px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation Header -->
    <header>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#about">About</a></li>
          <li><a href="index.html#projects">Projects</a></li>
          <li><a href="index.html#art">Art</a></li>
          <li><a href="index.html#widgets">Widgets</a></li>
          <li><a href="colors.html">Colors</a></li>
          <li><a href="games.html" class="active">Games</a></li>
        </ul>
      </nav>
    </header>

    <!-- Main Content -->
    <main>
      <div class="container">
        <h1>Games</h1>    
        <!-- Rock Paper Scissors Game -->
        <div class="game-container">
          <div class="player-name-section">
            <input type="text" id="playerNameInput" placeholder="Enter your name" maxlength="20">
            <button id="setNameBtn">Set Name</button>
            <p id="currentPlayerName" style="margin-top: 10px; font-weight: 600; color: #636B2F;"></p>
          </div>

          <div class="game-status">
            <h2>Rock Paper Scissors</h2>
            <div class="streak-counter">Win Streak: <span id="winStreak">0</span></div>
          </div>

          <div class="choices">
            <button class="choice-btn" data-choice="rock" title="Rock">🪨</button>
            <button class="choice-btn" data-choice="paper" title="Paper">📄</button>
            <button class="choice-btn" data-choice="scissors" title="Scissors">✂️</button>
          </div>

          <div class="results" id="results">
            <p>Choose your move to start playing!</p>
          </div>
        </div>

        <!-- Leaderboard -->
        <div class="leaderboard">
          <h2>🏆 Leaderboard - Best Win Streaks</h2>
          <ul class="leaderboard-list" id="leaderboardList">
            <li class="loading-message">Loading leaderboard...</li>
          </ul>
        </div>
      </div>
    </main>

    <!-- Firebase SDK and Game Script -->
    <script type="module" src="games.js"></script>
  </body>
</html>
